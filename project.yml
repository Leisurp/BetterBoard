name: BetterBoard

options:
  bundleIdPrefix: com.leisurp
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  BetterBoard:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leisurp.betterboard
        INFOPLIST_FILE: Support/App-Info.plist
        PRODUCT_NAME: BetterBoard
    dependencies:
      - target: BetterBoardKeyboard
        embed: true

  BetterBoardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leisurp.betterboard.keyboard
        INFOPLIST_FILE: Support/Keyboard-Info.plist
        PRODUCT_NAME: BetterBoardKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  BetterBoard:
    build:
      targets:
        BetterBoard: all
        BetterBoardKeyboard: all
